<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f4f6f8"><title>Loc2</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><link rel="stylesheet" href="/maps.css"><script src="/maps.js" nonce="{{MAPKIT_NONCE}}" defer></script><script src="/favorites.js" defer></script><link rel="stylesheet" href="/favorites.css"></head>
<body><main>
<header><span class="eyebrow">手机控制端</span><h1>Loc2</h1><p>选择目标，在 Mac 上保持 USB 定位会话。</p></header>
<section class="card" aria-labelledby="connection-title"><h2 id="connection-title">连接状态</h2><p id="connection" role="status">正在连接 Mac…</p><p id="pairing" class="secondary">首次使用请扫描 Mac 上的配对二维码。</p><p id="device" class="secondary"></p></section>
<section class="card" aria-labelledby="draft-title"><div class="section-title"><h2 id="draft-title">选点草稿</h2><span class="tag" id="draft-source">WGS84 输入</span></div><p class="secondary">修改草稿不会改变正在报点的目标。</p><div class="coordinates"><label>WGS84 纬度<input id="latitude" type="number" inputmode="decimal" min="-90" max="90" step="any" placeholder="-90 至 90"></label><label>WGS84 经度<input id="longitude" type="number" inputmode="decimal" min="-180" max="180" step="any" placeholder="-180 至 180"></label></div><p id="draft-status" class="secondary">可在未接线时准备草稿，连接后再点击应用。</p><div id="selection-tools"></div></section>
<section class="card" aria-labelledby="session-title"><h2 id="session-title">当前会话</h2><p id="accepted">尚未应用目标位置</p><p id="evidence" class="secondary">报点不代表手机已采用目标位置。</p><p id="recovery" class="secondary">停止后，请在手机地图中单独确认真实位置恢复。</p></section>
<p id="feedback" role="alert"></p>
<footer class="actions"><button id="apply" disabled>应用位置</button><button id="stop" class="secondary-button" disabled>停止报点</button></footer>
</main></body></html>
